name: totoggle-server-release

# A server release is explicit. Pushes comuns em main continuam executando apenas as esteiras de
# teste do servidor e do E2E, sem criar imagem nem publicar no Docker Hub.
# Exemplo
#   git tag server/v1.0.0 && git push origin server/v1.0.0
on:
  push:
    tags:
      - "server/v*"

defaults:
  run:
    working-directory: server

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/totoggle

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/web/package-lock.json

      - name: Test server
        run: go test ./... -cover

      - name: Test frontend
        working-directory: server/web
        run: |
          npm ci
          npm test
          npm run build

      - name: Validate Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#server/v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(steps.version.outputs.version, '-') }}

      - name: Build and publish multi architecture image
        uses: docker/build-push-action@v7
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "toToggle server v${{ steps.version.outputs.version }}"
          body: |
            Multi architecture container image for linux amd64 and linux arm64.

            ```sh
            docker pull ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ```
