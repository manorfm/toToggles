name: totoggle-java-release

# Triggered by a tag push (the "hook") matching totoggle_java/v*, e.g.:
#   git tag totoggle_java/v1.0.0 && git push origin totoggle_java/v1.0.0
#
# Builds, tests and packages the library (jar + sources + javadoc), then creates a GitHub
# Release with those artifacts attached. Actual Maven Central publishing (via the
# com.vanniktech.maven.publish plugin, see build.gradle.kts) is a separate, deliberately-disabled
# job below — it needs a Sonatype Central Portal user token (SONATYPE_USERNAME/PASSWORD secrets)
# that only a human can generate (central.sonatype.com login). The GPG signing key already exists
# (GPG_PRIVATE_KEY/GPG_PASSPHRASE secrets).

on:
  push:
    tags:
      - "totoggle_java/v*"

defaults:
  run:
    working-directory: totoggle_java

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Gradle Wrapper 8.7 (this project's version) doesn't support newer JDKs.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build (compiles, tests, jar + sourcesJar + javadocJar)
        run: ./gradlew build --no-daemon

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#totoggle_java/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "totoggle_java ${{ steps.version.outputs.version }}"
          body_path: totoggle_java/CHANGELOG.md
          files: totoggle_java/build/libs/*.jar

  # All 4 secrets (SONATYPE_USERNAME/PASSWORD, GPG_PRIVATE_KEY/PASSPHRASE) are configured —
  # runs on every totoggle_java/v* tag push.
  publish-maven-central:
    if: true
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Publish
        working-directory: totoggle_java
        run: ./gradlew publish --no-daemon
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
