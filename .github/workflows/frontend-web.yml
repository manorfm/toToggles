name: frontend-web

on:
  push:
    branches: [main]
    paths:
      - "server/web/**"
      - ".github/workflows/frontend-web.yml"
  pull_request:
    paths:
      - "server/web/**"
      - ".github/workflows/frontend-web.yml"

defaults:
  run:
    working-directory: server/web

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Matches the node:22-alpine image used by server/Dockerfile's frontend-builder stage.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build (tsc + vite build)
        run: npm run build
