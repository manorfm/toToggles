name: totoggle-go

on:
  push:
    branches: [main]
    paths:
      - "totoggle_go/**"
      - ".github/workflows/totoggle-go.yml"
  pull_request:
    paths:
      - "totoggle_go/**"
      - ".github/workflows/totoggle-go.yml"

defaults:
  run:
    working-directory: totoggle_go

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: totoggle_go/go.mod

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -race -cover
