name: e2e

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/e2e.yml"

defaults:
  run:
    working-directory: server

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      # Matches the node:20-alpine image used by server/Dockerfile's frontend-builder stage.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/web/package-lock.json

      - name: Build frontend (into server/static/app, served by the real Go binary)
        working-directory: server/web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/e2e/package-lock.json

      - name: Install Playwright
        working-directory: server/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run e2e suite (boots the real compiled server, drives the real built frontend)
        working-directory: server/e2e
        run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: server/e2e/test-results/
          retention-days: 7
