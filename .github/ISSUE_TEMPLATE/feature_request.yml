name: Feature request / suggestion
description: Suggest an idea, improvement, or new feature
labels: ["enhancement"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - server (Go)
        - totoggle_java (Kotlin/Java client)
        - totoggle_go (Go client)
        - totoggle_node (Node/TypeScript client)
        - other / not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that isn't possible (or is awkward) today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you'd imagine this working. Open to alternatives — describe the goal too.
